<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Confirmation</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Hotel Portal del Río</h1>
    </header>

    <main>

        <section class="confirmation">

            <h2>Reservation Confirmed ✅</h2>
            <p>Your reservation has been successfully completed.</p>

            <!-- DATOS DE LA RESERVA -->
            <div class="reservation-details">

                <p><strong>Check-in:</strong> <span id="checkIn"></span></p>
                <p><strong>Check-out:</strong> <span id="checkOut"></span></p>
                <p><strong>Room Type:</strong> <span id="roomType"></span></p>
                <p><strong>Guests:</strong> <span id="guests"></span></p>
                <p><strong>Nights:</strong> <span id="nights"></span></p>

            </div>

            <a href="index.html" class="btn">Back to Home</a>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Hotel Portal del Río</p>
    </footer>

    <script src="js/confirmacion.js"></script>

</body>
</html>
