<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container_header">
        <header>
        <button id="boton_show" class="btn"  type="button" onclick="show_menu()">Menu</button>
        <span>2026</span>
        <h1>Hotel puerta de oro</h1>
        <span>****</span>
        <button id="login" class="btn">Sign up</button>
        </header>

        <nav class="nav_index">
            <ul class="menu">
                <li><a href="#rooms" class="directions_menu">Rooms</a></li>
                <li><a href="#about_us" class="directions_menu">About</a></li>
                <li><a href="#services" class="directions_menu">Events</a></li>
                <li><a href="#contact" class="directions_menu">Contact Us</a></li>
            </ul>
        </nav>
    </div>
    <main id="reserva">
        <form id="form_reserva" action="#algun_lugar">
            <p>reservation details</p>

            <div class="form-group">
                <label for="first_name">first name</label>
                <input type="text" id="first_name" placeholder="">
            </div>

            <div class="form-group">
                <label for="last_name">last name</label>
                <input type="text" id="last_name" placeholder="">
            </div>

            <div class="form-group">
                <label for="email">email</label>
                <input type="email" name="email" id="email" placeholder="">
            </div>

            <div class="form-group">
                <label for="phone">phone number</label>
                <input type="tel" name="phone" id="phone" placeholder="">
            </div>

            <div class="form-group">
                <label for="check_in">check-in date</label>
                <input type="date" name="check_in" id="check_in">
            </div>

            <div class="form-group">
                <label for="check_in_time"></label>
                <input type="time" name="check_in_time" id="check_in_time">
            </div>

            <div class="form-group">
                <label for="check_out">check-out date</label>
                <input type="date" name="check_out" id="check_out">
            </div>

            <div class="form-group">
                <label for="check_out_time">check-out time</label>
                <input type="time" name="check_out_time" id="check_out_time">
            </div>

            <div class="form-group">
                <label for="rooms">rooms</label>
                <select name="rooms" id="rooms">
                    <option value="none"></option>
                    <option value="single">single</option>
                    <option value="double">double</option>
                    <option value="suite">suite</option>
                    <option value="Twin">Twin</option>
                    <option value="Double_Bedded">Double Bedded</option>
                    <option value="Family">Family</option>
                    <option value="Connecting">Connecting</option>
                    <option value="Deluxe">Deluxe</option>
                </select>
            </div>

            <div class="form-group">
                <label for="adults">adults</label>
                <input type="number" name="adults" id="adults">
            </div>

            <div class="form-group">
                <label for="children">children</label>
                <input type="number" name="children" id="children">
            </div>

            <div class="form-group">
                <label for="specials_requests">specials requests</label>
                <textarea name="specials_requests" id="specials_requests"></textarea>
            </div>

            <button type="submit">book now</button>
        </form>
    </main>
    <footer>
        <div class="container_information_footer">

            <div class="card_footer">
                <h4>Phone Support</h4><br>
                <p>+300 45789284</p>
            </div>

            <div class="card_footer">
                <h4>Follow Us</h4><br>
                <ul>
                    <li><a href="#">Instagram</a></li><br>
                    <li><a href="#">WhatsApp</a></li><br>
                    <li><a href="#">Facebook</a></li><br>
                </ul>
            </div>

            <div class="card_footer">
                <h4>Opening</h4><br>
                <div>
                    <p>Monday - Saturday</p>
                    <span>09AM - 09PM</span>
                </div><br>
                <div>
                    <p>Sunday</p>
                    <span>10AM - 08PM</span>
                </div>
            </div>

        </div>

        <div id="marca">&copy;<span id="year"></span>| Hotel Portal del Río</div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
